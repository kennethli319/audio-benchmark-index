        data_status: source_corpora_public_derived_sequences_models_and_scores_unreleased
        note: The paper reports 6,000 AudioMNIST and 2,552 Google Speech Commands test recordings and introduces exact and fuzzy digit recognition error rate. It does not publish the sampled sequence manifests, concatenated audio, oracle digit boundaries, trained informed models, bootstrap samples, or per-item predictions and scores.
      - domain: read_speech_privacy_baseline
        protocol: Informed transformer ASR models are fine-tuned on LibriSpeech train-clean-360 for each temporal-smoothing and resampling setting and evaluated on all of LibriSpeech test-clean; the original model is used for shredding
