      annotations: CC-BY-NC-SA-4.0
      audio: source_terms_apply
      dataset_card_metadata: conflicting_apache-2.0
      notes: >-
        The dataset card's prose says annotations are CC BY-NC-SA 4.0 and audio
        follows the original VoxCeleb and Expresso licenses, while its
        machine-readable front matter declares Apache-2.0 for the dataset.
        Treat the more specific prose and upstream source restrictions as
        controlling pending clarification; do not assume the Apache tag
        re-licenses recordings or annotations for commercial use.
