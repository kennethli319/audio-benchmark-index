      notes: >-
        The official repository releases a 1,000-item MMAR-meta.jsonl with
        ground-truth reasoning, cues, and five instance-specific rubric
        criteria per item, plus accuracy and rubric evaluation scripts.
        MMAR-Rubrics scores a reasoning chain only when its final answer is
        correct. The official challenge runs the judge five times and averages
        the middle three results. The helper downloads this approximately
        2.7 MB metadata and evaluation documentation by default without audio
        or executing the API-backed evaluator.
    sources:
