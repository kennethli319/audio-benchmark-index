        - 'NONVERBAL_TTS_DOWNLOAD_HF=1 scripts/download/nonverbal_tts.sh'
      notes: >-
        The public English release contains about 17 hours of speech derived
        from VoxCeleb and Expresso, with text-aligned labels for ten nonverbal
        vocalization types and eight emotion categories. The paper reports
        speaker-disjoint train, development, and test splits; OpenSTBench
        section 4.2 evaluates all 359 test samples for English-to-Chinese
        speech-translation paralinguistic fidelity, using text-tag positions
        to approximate event locations. The helper downloads official
        documentation and repository metadata by default. The approximately
        108 MiB test Parquet is a separate opt-in, and the full approximately
        3.9 GiB Hugging Face snapshot requires NONVERBAL_TTS_DOWNLOAD_HF=1.
