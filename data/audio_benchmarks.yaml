      - https://huggingface.co/api/datasets/OliviaWang1101/MeetingToM
    note: The official GitHub README promises code, benchmark files, evaluation scripts, and documentation "Coming Soon," while the Hugging Face repository contains only a README and zero bytes of dataset storage. MeetingToM is therefore an audited announced protocol, not a downloadable benchmark family. Recheck the official repositories before adding an indexed dataset or download helper.

  vip_mingle:
    paper: https://arxiv.org/abs/2607.13614
    sections: 2-3
    status: audited_not_indexed
    public_interfaces:
      - https://doi.org/10.5281/zenodo.20670131
    evaluated_domains:
      - domain: cross_setting_multiparty_conversation
        protocol: Paired within-subject in-person and Zoom sessions for 32 English-speaking groups, with raw audio/video, diarized speech, transcripts, psychometrics, facial features, and time-resolved ratings
        data_status: announced_unreleased
        note: The paper reports approximately 59 hours from 105 participants and 7,077 annotated segments. The placeholder README says the intended public media subset will cover 28 groups and 93 participants because four groups did not consent to public sharing.
    license:
      paper: CC BY 4.0
      benchmark_data: CC BY-NC-ND 4.0_declared_on_placeholder_record
      code: not_specified_unreleased
    sources:
      - https://arxiv.org/html/2607.13614v1#S2
      - https://arxiv.org/html/2607.13614v1#S3
      - https://zenodo.org/api/records/20670131
      - https://zenodo.org/api/records/20670132/files/README.md/content
    note: The paper says the scripts and dataset are available at the Zenodo DOI, but the current record contains only a README and explicitly says the full dataset will be released upon publication. That README still contains placeholders for the final dataset DOI, citation, license, ethics statement, and contact. Its detailed intended inventory is not evidence that the recordings, processed features, annotations, or code are downloadable. VIP-MINGLE is therefore recorded as an announced corpus rather than an indexed benchmark family; recheck the DOI after the Interspeech 2026 publication.

  deaf:
    paper: https://arxiv.org/abs/2603.18048
    sections: 2 and appendix A.2-A.5
    status: audited_not_indexed
    public_interfaces: []
    evaluated_domains:
      - domain: acoustic_semantic_conflict
        protocol: 2,756 English stimuli across emotion-semantic, background-sound-semantic, and speaker-identity-semantic conflicts, evaluated at three levels of increasing textual interference
        data_status: no_public_release_found
        note: The paper reports 1,248 emotion, 1,260 background-sound, and 248 speaker-identity clips. Levels 2 and 3 reuse the same audio with misleading prompts rather than adding clips.
    license:
      paper: CC BY 4.0
      benchmark_data: not_specified_unreleased
      upstream: EMIS, DEMAND, ElevenLabs model, and generated-content terms would apply to any future release
    sources:
      - https://arxiv.org/html/2603.18048v2#S2
      - https://arxiv.org/html/2603.18048v2#A1.SS2
      - https://arxiv.org/html/2603.18048v2#A1.SS3
      - https://arxiv.org/html/2603.18048v2#A1.SS5
    note: The v2 paper contains no project, repository, dataset-card, archive, or download URL. Its detailed construction recipe and public DEMAND source do not make the derived stimuli, scripts, prompts, labels, or evaluation code public, so DEAF is recorded as an audited protocol rather than a downloadable benchmark family.

  negeval_audio:
    paper: https://arxiv.org/abs/2607.12290
    title: "The Sound of Absence: Audio-Language Embedding Models Struggle with Negation"
    sections: 3-6 and appendix A
    status: audited_not_indexed
    public_interfaces: []
    evaluated_domains:
      - domain: negation_aware_audio_text_retrieval_and_multiple_choice
        protocol: Retrieval-Neg and four-option MCQ-Neg evaluations derived from the AudioCaps test split and Clotho evaluation split, with affirmation, negation, and hybrid MCQ conditions
        data_status: source_datasets_public_derived_annotations_and_items_unreleased
        note: The construction pipeline extracts present sound concepts, proposes contextually plausible absent concepts, verifies absence with Qwen2.5-Omni-7B, and uses Claude Opus 4.8 for text generation. A human audit of 460 automatically verified negative concepts across 200 sampled clips found 96.7% agreement, but the paper publishes no selected-item manifest, concepts, queries, MCQs, prompts, human judgments, or score records.
      - domain: controlled_audio_negation_diagnostic
        protocol: 1,000 ESC-50-derived target-distractor items sharing a base mixture and differing in whether a designated sound is present, with matched filler sounds from the same category group and similar loudness
        data_status: source_dataset_public_derived_mixtures_and_manifest_unreleased
        note: Section 6.4 and appendix A compare negated queries with affirmative, scope-swapped, bag-of-concepts, paraphrase, and content-swapped variants. The paper does not release the mixture recipes, selected source clips, random seeds, target-distractor audio, query variants, or per-item measurements.
    license:
      paper: arXiv perpetual non-exclusive license
      evaluation_artifacts: not_specified_unreleased
      upstream: AudioCaps, Clotho, ESC-50, and their source-media terms remain applicable; public source corpora do not make the derived NegEval-Audio artifacts public
    sources:
      - https://arxiv.org/abs/2607.12290
      - https://arxiv.org/html/2607.12290v1#S3
      - https://arxiv.org/html/2607.12290v1#S5
      - https://arxiv.org/html/2607.12290v1#S6.SS4
      - https://arxiv.org/html/2607.12290v1#A1
      - https://export.arxiv.org/api/query?id_list=2607.12290
      - https://research.google.com/audiocaps/
      - https://zenodo.org/records/4783391
      - https://github.com/karolpiczak/ESC-50
    note: Version 1 provides no official project page, repository, dataset card, archive, derived query or MCQ files, concept annotations, controlled mixtures, prompts, evaluation-code link, or standalone data-license statement. Public AudioCaps, Clotho, and ESC-50 source datasets do not make NegEval-Audio's derived artifacts public, so it remains an audited protocol rather than a downloadable benchmark family.

  sound_symbolism_slm:
    paper: https://arxiv.org/abs/2607.10162
    title: "Hearing Like Humans? Sound Symbolism and Perceptual Alignment in Speech Language Models"
    sections: 3 and appendices B-D
    status: audited_not_indexed
    public_interfaces:
      - https://anonymous.4open.science/r/Sound-Symbolism-SLM
    evaluated_domains:
      - domain: auditory_and_crossmodal_sound_symbolism
        protocol: Four experiments test rounded-versus-pointed judgments for two spoken bouba/kiki stimuli across 25 prompt languages, seven-point ratings for 536 spoken pseudowords, audio-to-shape matching, and visual-only ratings for 90 shapes
        data_status: upstream_stimuli_mixed_exact_evaluation_package_unverified
        note: Experiments 1 and 3 reuse two recordings from Ćwiek et al.; experiment 2 uses 536 of 537 McCormick et al. pseudowords and human ratings and dissimilarity matrices from Lacey et al.; experiments 3 and 4 use two and 90 Lacey et al. shapes respectively. The paper says full prompt translations will be released with code, but its sole code URL currently requires authentication and exposes no verifiable files, revision, item manifest, prompts, model outputs, or score records.
    license:
      paper: CC BY-SA 4.0
      evaluation_artifacts: not_specified_unverified
      upstream: Previously published audio and human perceptual data retain their source-study terms; the paper says Lacey et al. shape stimuli and dissimilarity matrices are available from the corresponding author for academic research
    sources:
      - https://arxiv.org/abs/2607.10162
      - https://arxiv.org/html/2607.10162v1#S3
      - https://arxiv.org/html/2607.10162v1#A2
      - https://arxiv.org/html/2607.10162v1#A4
      - https://export.arxiv.org/api/query?id_list=2607.10162
      - https://anonymous.4open.science/r/Sound-Symbolism-SLM
    note: The paper describes a useful speech-perception evaluation and cites an anonymous code interface, but that interface currently returns HTTP 401 to an unauthenticated request. Without a publicly inspectable repository, dataset card, archive, commit snapshot, standalone license, or exact evaluation artifacts, the protocol cannot be verified as a public benchmark release and no download helper is added. Public availability of some source-study data does not itself release this paper's selected inputs, translated prompts, repeated trials, outputs, or scoring package.

  production_oriented_sfx_evaluation:
    paper: https://arxiv.org/abs/2607.09973
    sections: 3.3, 4, and appendix B
    status: audited_not_indexed
    public_interfaces:
      - https://melodiedesbos.github.io/A-PRODUCTION-ORIENTED-FRAMEWORK-FOR-EVALUATION-OF-SFX-GENERATION/
    evaluated_domains:
      - domain: reference_guided_sound_effect_variation
        protocol: ESC-50 folds 1-3 for adaptation, fold 4 for validation, and fold 5 for testing; five systems each generate 10 variants for 400 test references, producing 4,000 outputs per system
        data_status: source_corpus_public_derived_evaluation_artifacts_unreleased
        note: The shared audio-to-audio protocol reports quality, reference identity, diversity, temporal structure, perceptual fidelity, inference cost, and production-readiness diagnostics. The paper also samples 100 reference-variation pairs per method for a five-point listening test.
      - domain: sound_effect_editing_diagnostics
        protocol: Method-specific SFX morphing, inpainting, temporal alignment, and targeted-editing analyses
        data_status: selected_project_page_demos_only
        note: The official page streams a small set of qualitative examples, but does not provide the complete generated-output set, reference list, random seeds, masks, instructions, per-item metrics, listener trial manifest, or ratings.
    license:
      paper: CC BY 4.0
      evaluation_artifacts: not_specified_unreleased
      project_page_samples: no_separate_license_found
      upstream: ESC-50 is CC BY-NC 3.0, with its ESC-10 subset under CC BY; baseline checkpoint and evaluator terms also apply
    sources:
      - https://arxiv.org/html/2607.09973v1#S3.SS3
      - https://arxiv.org/html/2607.09973v1#S4
      - https://arxiv.org/html/2607.09973v1#S6.SS2
      - https://melodiedesbos.github.io/A-PRODUCTION-ORIENTED-FRAMEWORK-FOR-EVALUATION-OF-SFX-GENERATION/
      - https://github.com/karolpiczak/ESC-50
      - https://raw.githubusercontent.com/karolpiczak/ESC-50/master/README.md
    note: ESC-50 itself is already indexed as a public source dataset. This paper defines a new derived evaluation protocol rather than releasing a separate benchmark package. Its official page provides selected listening demos and aggregate results but no repository, dataset card, archive, complete output corpus, evaluation implementation, or data-license statement, so the protocol is audited without adding a duplicate benchmark family or download helper.

  multimodal_speaker_verification_anonymization:
    paper: https://arxiv.org/abs/2607.19636
    sections: 4.1-4.3
    status: audited_not_indexed
    public_interfaces:
      - https://github.com/Ashigarg123/multimodal-speaker-verification
    evaluated_domains:
      - domain: multi_utterance_speaker_verification_under_anonymization
        protocol: Speaker-disjoint Fisher English trials compare original and Stream-Voice-Anon-anonymized speech under lazy-informed and semi-informed attackers, aggregating up to five utterances with acoustic, linguistic, and prosodic representations
        data_status: no_public_trial_release_found
        note: The paper reports 5,712 training, 250 validation, and 1,753 evaluation speakers and a fixed validation list with 100 target and 100 non-target trials per speaker, but it does not release speaker splits, trial lists, derived anonymized audio, or preprocessing metadata.
    license:
      paper: arXiv perpetual non-exclusive license
      benchmark_data: not_specified_unreleased
      upstream: Fisher English requires the applicable LDC licenses; Stream-Voice-Anon and LibriSpeech terms also apply to the anonymization pipeline and target-speaker audio
    sources:
      - https://arxiv.org/html/2607.19636v1#S4.SS1
      - https://arxiv.org/html/2607.19636v1#S4.SS2
      - https://arxiv.org/html/2607.19636v1#S4.SS3
      - https://raw.githubusercontent.com/Ashigarg123/multimodal-speaker-verification/main/README.md
      - https://api.github.com/repos/Ashigarg123/multimodal-speaker-verification
      - https://api.github.com/repos/Ashigarg123/multimodal-speaker-verification/git/trees/main?recursive=1
      - https://catalog.ldc.upenn.edu/LDC2004S13
