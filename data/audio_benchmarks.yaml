        adaptation, reporting AUC and pAUC. The helper downloads official
        documentation and repository metadata by default; cloning the small
        code repository is opt-in. Obtain the six source datasets from their
        official DCASE pages. The helper intentionally does not fetch the
        repository's convenience Google Drive package because its separate
        redistribution terms are not stated.
