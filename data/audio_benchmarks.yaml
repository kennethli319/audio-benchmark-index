      notes: >-
        The public, ungated Zenodo release contains 499 CSV rows with filenames
        and 13 structured semantic, caption, and UCS fields. The original paper
        and project page describe 500 manually screened AudioCards, but the
        released CSV currently has 499 data rows. Pair its filename column with
        the separately downloaded Adobe Audition Sound Effects library to
        reproduce ASFx Eval. The July 2026 evaluation-framework paper uses 499
        clips. Its Table 1 selects ten released semantic fields and adds five
        computed acoustic targets (LUFS, pitch, onset, offset, and a frequency
        profile), but says that augmented dataset "will" be released; those
        five acoustic annotations are not part of the current Zenodo file.
        The helper safely downloads the record metadata, project page, papers,
        Adobe landing page, and approximately 323 KB annotation CSV; it does
        not download the Adobe audio archives.
    license:
      data: CC-BY-4.0_annotations_with_separate_Adobe_audio_terms
      code: not_specified
      notes: >-
        Zenodo declares CC BY 4.0 for the released AudioCard CSV. The underlying
        Adobe sound effects are not included there: Adobe describes them as
        royalty-free but states that downloading and using them is governed by
        the Adobe Audition and related-software EULA. The July 2026 paper is
        CC BY-NC-SA 4.0, but that paper license does not release or license its
        absent four-field augmentation or perturbation artifacts.
