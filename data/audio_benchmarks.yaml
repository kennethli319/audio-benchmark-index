        Chinese. Fixed- and mixed-prompt configurations each expose 362
        long-form and 1,560 short-form examples; the underlying media is shared
        rather than duplicated across configurations. The helper downloads the
        official cards, API metadata, four small Parquet manifests, and eight
        compressed reference files by default. Cloning the evaluation code is
