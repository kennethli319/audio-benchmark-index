  scope_shift_aware_emotion_recognition:
    paper: https://arxiv.org/abs/2607.20445
    title: "SCoPE: Shift-Aware Speaker-Conditioned Priors for Emotion Recognition in Conversations"
    sections: 4-5
    status: audited_existing_coverage_protocol
    evaluated_sets:
      - cited_as: IEMOCAP
        index_id: iemocap
        status: public_form_gated
        note: The paper uses the conventional six-class multimodal emotion-recognition task and pre-extracted RoBERTa, DenseNet, and openSMILE features attributed to the SDT baseline.
      - cited_as: MELD
        index_id: meld
        status: public_with_media_rights_caveat
        note: The paper uses all seven emotion classes and pre-extracted multimodal SDT features; the underlying clips derive from the Friends television series.
    protocol_note: >-
      The experiments train ten models per dataset for 150 epochs and report
      mean, standard deviation, and best-run Accuracy and weighted F1, including
      per-emotion results. Emotion-shift supervision is derived from changes
      between consecutive utterances by the same speaker. The paper does not
      publish the exact feature files, split manifests, derived shift labels,
      random seeds, checkpoints, predictions, or score records.
    release_audit:
      status: no_paper_specific_release_identified
      note: >-
        The v1 paper and arXiv HTML provide no project page, repository,
        dataset card, archive, supplementary artifact, or code link. They state
        that feature representations released by the SDT repository were used,
        but do not identify a revision or publish a SCoPE experiment package.
    license:
      paper: arXiv perpetual non-exclusive license
      code: not_specified_unreleased
      derived_evaluation_artifacts: not_specified_unreleased
      upstream: IEMOCAP uses a custom request-based research license; MELD declares GPL-3.0 but its Friends-derived media requires separate rights review
    sources:
      - https://arxiv.org/abs/2607.20445
      - https://arxiv.org/html/2607.20445v1#S4
      - https://arxiv.org/html/2607.20445v1#S4.SS1
      - https://arxiv.org/html/2607.20445v1#S4.SS4
      - https://arxiv.org/html/2607.20445v1#S5
      - https://sail.usc.edu/iemocap/iemocap_release.htm
      - https://affective-meld.github.io/
      - https://github.com/declare-lab/MELD
    note: >-
      SCoPE is recorded as an evaluation-protocol audit over the two existing
      benchmark families, not as a new downloadable family. Their established
      access paths and helpers remain authoritative; no duplicate entry or
      invented paper-specific download is added.

  cumsum_phase_transport_keyword_spotting:
    paper: https://arxiv.org/abs/2607.20086
    title: "Cumsum-Composable Phase Transport for Low-Cost Streaming Keyword Spotting"
    sections: 3-4
    status: audited_existing_coverage_protocol
    evaluated_sets:
      - cited_as: Google Speech Commands v2
        index_id: speech_commands
        status: public
        note: >-
          All experiments use one-second 16 kHz clips and the conventional
          12-class setup: ten target commands plus unknown and silence.
          Unknown examples are subsampled to the average target-class count,
          while silence examples are generated from the corpus background-noise
          clips.
    protocol_note: >-
      The paper reports single-seed clip-classification accuracy for compact
      mel and raw-audio CNN baselines, fixed-frequency and tied cumsum models,
      and a matched learned-decay scan baseline. Full local runs use about
      36,000 training examples for 40 or 80 epochs. Although the architecture
      has an exact online form, the paper explicitly evaluates clip
      classification rather than continuous-stream false-accept, false-reject,
      trigger-latency, or event-onset metrics.
    release_audit:
      status: no_paper_specific_release_identified
      note: >-
        The v1 paper and arXiv record provide no official project page,
        repository, dataset card, configuration files, split manifest,
        implementation, checkpoints, predictions, or score records. The public
        Speech Commands v2 corpus and its existing helper remain the only
        verifiable data release for this evaluation.
    license:
      paper: cc-by-4.0
      code: not_specified_unreleased
      derived_evaluation_artifacts: not_specified_unreleased
      upstream: Speech Commands v2 is CC BY 4.0
    sources:
      - https://arxiv.org/abs/2607.20086
      - https://arxiv.org/html/2607.20086v1#S3
      - https://arxiv.org/html/2607.20086v1#S4
      - https://arxiv.org/abs/1804.03209
      - https://www.tensorflow.org/datasets/catalog/speech_commands
      - https://research.google/blog/launching-the-speech-commands-dataset/
    note: >-
      This work is recorded as a protocol audit over the already indexed
      Speech Commands family, not as a new benchmark. No duplicate family or
      paper-specific download helper is added.

  auto_aeg_aegbench:
    paper: https://arxiv.org/abs/2607.04383
    sections: abstract, 3.3, 4, and appendix K
