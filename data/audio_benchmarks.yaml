      - cited_as: UrBAN
        index_id: urban_beehive
        status: public_large_manual_transfer
        note: >-
          The paper uses more than 3,000 hours of 16 kHz audio from nine UrBAN
          hives monitored in 2021-2022. It assigns a continuous colony-strength
          target to each 15-minute segment by linearly interpolating between
          manual frame-of-bees inspections.
    protocol_note: >-
