  light_mer_emotion_evaluation:
    paper: https://arxiv.org/abs/2607.12787
    title: "Do We Really Need Multimodal Emotion Language Models Larger Than 1B Parameters?"
    sections: 4.1 and 5.1
    status: audited_mixed_existing_and_new_public_families
    last_verified: 2026-07-24
    evaluated_sets:
      - cited_as: MER2023
        index_id: mer2023
        status: public_request_gated
      - cited_as: MER2024
        index_id: mer2024
        status: public_request_gated
      - cited_as: MELD
        index_id: meld
        status: public
      - cited_as: IEMOCAP
        index_id: iemocap
        status: public_request_gated
      - cited_as: CMU-MOSI
        index_id: cmu_mosi
        status: public_processed_features
      - cited_as: CMU-MOSEI
        index_id: cmu_mosei
        status: public_processed_features
      - cited_as: CH-SIMS
        index_id: ch_sims
        status: public_manual_drive
      - cited_as: CH-SIMS v2
        index_id: ch_sims_v2
        status: public_manual_drive
      - cited_as: OV-MERD+
        index_id: ov_merd
        status: public_family_gated_release
        note: The paper reports the OV-MERD+ fine-grained open-vocabulary track; the index maps it conservatively to the official OV-MERD/MER2025 release family rather than claiming a separately licensed archive.
    protocol_note: >-
      Section 4.1 evaluates nine multimodal emotion and sentiment families.
      Section 5.1 reports HIT for basic emotion recognition, weighted average
      F1 for sentiment analysis, and Fs for the OV-MERD+ open-vocabulary task.
      MER2023, MER2024, CH-SIMS, CH-SIMS v2, CMU-MOSI, and CMU-MOSEI are
      separately indexed from their primary releases. The remaining families
      retain their existing entries and access caveats.
    license_note: >-
      Access and terms differ across the nine families. In particular,
      CH-SIMS and processed CMU-MOSEI packages are distributed through shared
      Drive folders. Their toolkit MIT licenses clearly cover repository code
      but do not expressly license dataset annotations, features, or source
      media. Existing MELD, IEMOCAP, and OV-MERD entries retain their own media
      and access caveats.
    sources:
      - https://arxiv.org/abs/2607.12787
      - https://arxiv.org/html/2607.12787v1#S4.SS1
      - https://github.com/GAIR-Lab/Light-MER
      - https://aclanthology.org/2020.acl-main.343/
      - https://github.com/thuiar/MMSA
      - https://aclanthology.org/P18-1208/
      - https://github.com/CMU-MultiComp-Lab/CMU-MultimodalSDK
      - https://github.com/pliang279/MultiBench

  voice_concept_bottleneck_health_evaluation:
    paper: https://arxiv.org/abs/2607.16967
    title: "An Audio Language Model-Based Voice Concept Bottleneck Framework for Interpretable Health Assessment"
    sections: 3.1 and 4
    status: audited_public_families
    last_verified: 2026-07-24
    evaluated_sets:
      - cited_as: PVQD
        index_id: pvqd
        status: public
      - cited_as: Android Corpus
        index_id: androids_corpus
        status: public_restricted_terms
      - cited_as: TORGO
        index_id: torgo
        status: public_nonprofit_academic_only
        note: >-
          The paper uses only head-mounted-microphone recordings and evaluates
          dysarthria with leave-one-speaker-out cross-validation. The official
          release packages data by speaker group rather than publishing this
          paper's exact evaluation manifest.
    protocol_note: >-
      Section 3.1 fine-tunes the audio-language-model concept extractor on
      PVQD, evaluates depression on the Android Corpus interview subset using
      the official five folds, and evaluates dysarthria on TORGO with
      leave-one-speaker-out cross-validation. TORGO's owner release includes
      the source acoustic and articulatory recordings but not the paper's
      headMic-only split manifest or derived model features.
    license_note: >-
      TORGO's University of Toronto page permits use free of charge only for
      academic, non-profit purposes and requires citation of at least one
      listed paper. It does not state a standard open-data license. PVQD and
      Android Corpus retain their separately documented terms and sensitive
      human-voice caveats.
    sources:
      - https://arxiv.org/abs/2607.16967
      - https://arxiv.org/html/2607.16967v1#S3.SS1
      - http://www.cs.toronto.edu/~complingweb/data/TORGO/torgo.html
      - https://link.springer.com/article/10.1007/s10579-011-9145-0

  multimodal_ambivalence_hesitancy_evaluation:
    paper: https://arxiv.org/abs/2607.15779
    title: "Multimodal Ambivalence and Hesitancy Recognition via Cross-Attention and Gated Fusion"
    sections: 3-7
    status: audited_new_restricted_public_family
    last_verified: 2026-07-24
    evaluated_sets:
      - cited_as: BAH
        index_id: bah
        status: public_request_gated_research_only
        note: >-
          The ABAW11 paper evaluates the official 1,427-video annotated
          release and a separately distributed 152-video unlabeled private
          challenge test set. The indexed family documents the reusable
          research release rather than treating the private test set as a
          separate downloadable benchmark.
    protocol_note: >-
      Section 3 uses participant-disjoint training, validation, and public
      test splits with video-level binary ambivalence/hesitancy labels. The
      paper extracts text, audio, and visual features and reports Macro F1 for
      unimodal and multimodal fusion systems. The official BAH release also
      provides frame-level timestamps and cues, transcripts, aligned faces,
      participant metadata, and predefined splits.
    license_note: >-
      BAH is distributed only after an eligible full-time faculty member
      submits the official request form and signed EULA. The owner page calls
      the dataset proprietary and research-only. BSD-3-Clause covers the
      public baseline repository, not the participant recordings or
      annotations.
    sources:
      - https://arxiv.org/abs/2607.15779
      - https://arxiv.org/html/2607.15779v1#S3
      - https://arxiv.org/abs/2505.19328
      - https://www.etsmtl.ca/en/labs/livia/datasets/bah-ambivalence-hesitancy
      - https://github.com/LIVIAETS/bah-dataset
      - https://affective-behavior-analysis-in-the-wild.github.io/11th/#counts1

  fillgauss_fillimpact_evaluation:
    paper: https://arxiv.org/abs/2607.17773
    title: "FillGauss: Fine-Grained Filling-Aware Impact Sound Generation for 3D Gaussian Splatting"
    sections: 3 and 5.1-5.2
    status: audited_announced_unreleased
    last_verified: 2026-07-24
    evaluated_sets:
      - cited_as: FillImpact
        index_id: null
        status: announced_unreleased
        note: >-
          The paper describes more than 5,000 impact recordings from 88
          real-world objects, paired 3D Gaussian representations, strike
          positions, container and striker materials, and hollow, water, or
          rice fill conditions. It uses an 80/20 train/test split but publishes
          no row manifest or reusable evaluation package.
    protocol_note: >-
      FillGauss evaluates position-, striker-, fill-level-, and fill-material-
      aware impact-sound generation with FAD, KL divergence, Inception Score,
      MOS, pairwise win rate, matched-attribute count, and per-attribute
      identification accuracy. The main evaluation text says the blind
      listening study had eight participants, while Appendix A.3 says 20; this
      audit preserves that unresolved paper inconsistency. The paper does not
      publish the test split, generated outputs, listener responses, prompts,
      or evaluation implementation.
    release_note: >-
      Version 1 provides no official project page, repository, dataset card,
      DOI record, archive, code release, or download URL. The article uses
      arXiv's perpetual non-exclusive license, which does not license the
      absent recordings, 3D representations, annotations, or evaluation
      artifacts. FillImpact is therefore not added as a downloadable benchmark
      family; recheck after an owner-controlled public release appears.
    sources:
      - https://arxiv.org/abs/2607.17773
      - https://arxiv.org/html/2607.17773v1#S3
      - https://arxiv.org/html/2607.17773v1#S5.SS1
      - https://arxiv.org/html/2607.17773v1#S5.SS2

  audio_visual_flamingo_audio_evaluation:
    paper: https://arxiv.org/abs/2607.16107
    title: "Nemotron-Labs-Audio-Visual Flamingo: Open Audio-Visual Intelligence for Long and Complex Videos"
    sections: 3-4
    status: audited_existing_coverage_with_one_unavailable_upstream_release
    last_verified: 2026-07-24
    evaluated_sets:
      - cited_as: MMAR
        index_id: mmar
        status: public
      - cited_as: MMSU
        index_id: mmsu
        status: public
      - cited_as: MMAU (v05.15.25)
        index_id: mmau
        status: public
        note: The report identifies the May 15, 2025 MMAU version.
      - cited_as: WorldSense
        index_id: worldsense
        status: public
      - cited_as: DailyOmni
        index_id: daily_omni
        status: public
      - cited_as: MMOU
        index_id: mmou
        status: public
        note: The results section evaluates long and complex audio-visual understanding on MMOU.
      - cited_as: LibriSpeech (clean / other)
        index_id: librispeech
        status: public
      - cited_as: SPGISpeech
        index_id: spgispeech
        status: public_gated_restricted_terms
      - cited_as: TEDLIUM
        index_id: null
        status: official_release_currently_unavailable
        note: >-
          The citation resolves TEDLIUM to TED-LIUM Release 3. Its paper is
          public and the official Kaldi recipe still points to OpenSLR SLR51,
          but the SLR51 landing page and archive currently return not found.
          No unofficial mirror is indexed as an authoritative replacement.
      - cited_as: GigaSpeech
        index_id: gigaspeech
        status: public_gated_restricted_terms
      - cited_as: Common Voice 15
        index_id: common_voice
        status: public
      - cited_as: VoxPopuli
        index_id: voxpopuli
        status: public
        note: The results section reports a VoxPopuli WER even though the evaluation-datasets paragraph omits it.
    protocol_note: >-
      The report evaluates audio understanding with accuracy, ASR with WER,
      and joint audio-visual understanding with the indexed omni-modal
      families. Video-MME, ActivityNet-QA, and LongVideoBench are listed under
      video understanding rather than audio evaluation and are not treated as
      new audio benchmark families in this audit.
    license:
      paper: cc-by-4.0
      benchmark_data: mixed_see_indexed_families
      tedlium_release_3: not_reverified_release_unavailable
    sources:
      - https://arxiv.org/abs/2607.16107
      - https://arxiv.org/html/2607.16107v1#S3
      - https://arxiv.org/html/2607.16107v1#S4
      - https://doi.org/10.1007/978-3-319-99579-3_21
      - https://www.openslr.org/51
      - https://www.openslr.org/resources/51/TEDLIUM_release-3.tgz
      - https://github.com/kaldi-asr/kaldi/blob/master/egs/tedlium/s5_r3/local/download_data.sh
    note: >-
      This audit adds no benchmark family. Eleven named audio, speech, and
      omni-modal families were already indexed. TED-LIUM Release 3 is recorded
      only as an unavailable upstream release until an official public
