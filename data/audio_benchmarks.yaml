        data_status: announced_unreleased_empty_repository
        note: The paper reports 10-120-second clips, 0.5-60-second target events, and strict disjointness from its Auto-AEG training corpus, but the linked public Hugging Face repository currently contains only .gitattributes and reports zero bytes of dataset storage.
    license:
