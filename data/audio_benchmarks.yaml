      code: CC0-1.0
      notes: The repository applies a CC0-1.0 LICENSE and GitHub detects CC0-1.0, but the paper states that every TREA audio file combines recordings from ESC-50, whose dataset is CC BY-NC 3.0 and whose ESC-10 subset clips are CC BY. Treat the restrictive upstream terms and clip attribution as surviving the derived release rather than assuming the repository-level CC0 waiver clears all source-audio rights.
