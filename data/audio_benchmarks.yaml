      notes: TREA is a public, ungated 600-item temporal-reasoning benchmark derived by combining ESC-50 clips. Its TREA-O, TREA-C, and TREA-D subsets each contain 200 ordering, counting, or duration questions. The July 2026 Audio-Zero paper evaluates both Qwen2-Audio-7B-Instruct and Qwen2.5-Omni-7B on TREA alongside MMAU Test-mini and MMAR. The repository releases both four-option multiple-choice and open-text answer formats, audio, metadata, evaluation code, and uncertainty perturbation scripts. The helper downloads official documentation, repository metadata, license, paper page, and the lightweight CSV annotations by default; set TREA_CLONE_REPO=1 to clone the approximately 688 MiB GitHub repository and its audio.
