    official:
      paper: https://arxiv.org/abs/2410.01495
      openreview: https://openreview.net/forum?id=Y8lfuSoqQz
      repo: https://github.com/zeroQiaoba/AffectGPT/tree/master/OV-MER
      dataset: https://huggingface.co/datasets/MERChallenge/MER2025
    download:
