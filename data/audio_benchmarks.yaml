        note: >-
          Section 4.1 says all experiments use 48 kHz English Emilia segments
          cropped or padded to 120,000 samples. Section 4.2 reports perceptual
          metrics on a 1,000-sample subset, but the paper does not identify the
          rows, source shards, selection procedure, or a reusable evaluation
          split.
    protocol_note: >-
      This is a model study rather than a released benchmark family. It tests a
