      - https://cmots.github.io/steb.github.io/
      - https://github.com/cmots/STEB
      - https://raw.githubusercontent.com/cmots/STEB/main/README.md
      - https://api.github.com/repos/cmots/STEB
      - https://huggingface.co/datasets/cmots/STEB
      - https://huggingface.co/api/datasets/cmots/STEB

  rw_voice_eq_bench:
    paper: https://arxiv.org/abs/2607.14846
    sections: 2 and 4-7
    status: audited_not_indexed
    public_interfaces:
      - https://huggingface.co/spaces/HumeAI/rw-voice-eq
      - https://huggingface.co/spaces/HumeAI/asr-leaderboard
    evaluated_domains:
      - domain: text_to_speech
        protocol: 30 evaluations across seven dimensions, with up to 120 prompts per category
        data_status: no_public_item_release_found
      - domain: speech_to_speech
        protocol: Five task families using fixed user audio, prerecorded prompts, and matched audio-only/transcript-only conditions where applicable
        data_status: no_public_item_release_found
      - domain: speech_understanding
        protocol: Six emotion, speaker-matching, and synthetic-speech-detection evaluations
        data_status: no_public_item_release_found
      - domain: automatic_speech_recognition
        protocol: Four English robustness sets for accented, emotional, background-audio, and conversational speech
        data_status: private_unreleased
        note: Section 7.2 explicitly calls all four ASR sets private. They total roughly 17 hours; public online video and Hume-DaiKon are source descriptions, not public benchmark downloads.
    note: The public Hugging Face Spaces expose leaderboards and application code, not benchmark audio or item files. RW-Voice-EQ is therefore recorded as an audited protocol rather than a downloadable benchmark family; no data link should be inferred from the public leaderboards.

  song_sqa:
    paper: https://arxiv.org/abs/2607.16599
    sections: 4.1 and 4.5
    status: audited_mixed_public_and_internal
    evaluated_sets:
      - cited_as: Lyra-SA Dataset
        index_id: lyra_sa
        status: public_application_required
        note: The official Tencent Music release is indexed separately. The paper evaluates five independent random 8:1:1 splits but does not publish split manifests or random seeds.
      - cited_as: Internal Dataset
        index_id: null
        status: proprietary_unreleased
        note: Section 4.1 describes 2,035 recordings from 1,250 singers covering 1,284 songs, with isolated vocals and expert overall and attribute ratings. The paper explicitly calls the dataset proprietary and provides no public data source.
      - cited_as: subjective evaluation set
        index_id: null
        status: selected_samples_only
        note: Section 4.5 uses five test-set songs and 60 pairwise judgments. The public demo streams selected segments, but no complete item manifest, listener-level ratings, or reusable benchmark package is provided.
    sources:
      - https://arxiv.org/html/2607.16599v1#S4.SS1
      - https://arxiv.org/html/2607.16599v1#S4.SS5
      - https://anon-music.github.io/audio-eval-demo/
      - https://lyracobar.y.qq.com/singvoicedataset_en.html
    note: SongSQA's public Lyra-SA component maps to the indexed application-based release. Its proprietary expert-rated corpus and small subjective study are recorded only as unreleased protocols; the demo's selected audio examples must not be treated as a dataset release.

  carecos:
    paper: https://arxiv.org/abs/2607.03356
    sections: 3-4
    status: audited_not_indexed
    evaluated_domains:
      - domain: medical_acoustic_spectrogram_reasoning
        protocol: Mel-spectrogram question answering over cardiac, respiratory, and cough recordings, with two metadata-grounded explicit questions and two inferred clinical-reasoning questions generated per recording
        data_status: benchmark_questions_spectrograms_and_splits_not_released
        note: The paper derives CaReCoS from seven named public medical-audio datasets—ICBHI 2017, KAUH, SPRSound, CirCor, ZCH, Coswara, and the EPFL Multimodal Cough Detection dataset—but provides no item manifest, generated question-answer file, spectrogram archive, split definition, or official download interface.
      - domain: raw_audio_medical_reasoning
        protocol: Raw-audio ablation for Qwen2.5-Omni-7B, Gemini 2.5 Flash, and Gemini 2.5 Pro
        data_status: evaluation_inputs_and_outputs_not_released
        note: Section 4 reports the ablation against the same medical sources, but does not release the exact evaluated rows, prompts, model outputs, or judge records.
    license:
      paper: CC BY 4.0
      benchmark_data: not_specified_unreleased
      upstream: Each of the seven source datasets retains its own access, consent, and reuse terms
    sources:
      - https://arxiv.org/abs/2607.03356
      - https://arxiv.org/html/2607.03356v1#S3
      - https://arxiv.org/html/2607.03356v1#S4
    note: CaReCoS is recorded as an audited protocol rather than a downloadable benchmark family. The v1 paper has no project page, repository, dataset card, archive, code link, or benchmark-license statement. Public availability of the seven source corpora does not release the paper's derived spectrograms, questions, answers, inferred clinical labels, evaluation selections, or splits, and the paper's CC BY 4.0 license applies to the article rather than absent benchmark files.

  bcoughbench:
    paper: https://arxiv.org/abs/2606.25116
    sections: 2.1-2.4
    status: audited_not_indexed
    public_interfaces: []
    evaluated_domains:
      - domain: respiratory_health_classification_and_regression
        protocol: Nine classification tasks and three age-regression tasks over CoughVID, Coswara, CIDRZ, Cough-COPD(CC), and CovidUK, evaluated on smartphone audio and five EBEN-simulated body-coupled sensor conditions
        data_status: source_corpora_mixed_benchmark_artifacts_unreleased
        note: The five simulated conditions are forehead accelerometer, soft and rigid in-ear microphones, temple vibration pickup, and throat microphone. The paper reports task-level clip counts and says official or subject-disjoint splits are used, but provides no row manifest, split files, transformed cough audio, or evaluation package.
    license:
      paper: CC BY 4.0
      benchmark_data: not_specified_unreleased
      code: not_specified_unreleased
      upstream: The five cough corpora retain their own access, health-data, consent, and reuse terms; the public Cough-COPD(CC) Zenodo record lists CC BY 4.0
    sources:
      - https://arxiv.org/abs/2606.25116
      - https://arxiv.org/html/2606.25116v1#S2.SS1
      - https://arxiv.org/html/2606.25116v1#S2.SS2
      - https://arxiv.org/html/2606.25116v1#S2.SS4
      - https://export.arxiv.org/api/query?id_list=2606.25116
      - https://doi.org/10.5281/zenodo.14881818
      - https://zenodo.org/api/records/14881818
    note: BCoughBench is recorded as an audited protocol rather than a downloadable benchmark family. Version 1 and its arXiv metadata expose no official project, repository, dataset card, archive, item manifest, derived body-coupled audio, evaluation code, or benchmark-license statement. Public availability of individual source corpora or EBEN checkpoints does not release the paper's exact selections, subject-disjoint splits, simulated clips, or evaluation artifacts, so no helper or duplicate source-corpus entry is added.

  preference_asr:
    paper: https://arxiv.org/abs/2606.29534
    sections: 2-3 and appendix
    status: audited_not_indexed
    public_interfaces:
      - https://github.com/nithinraok/preference-asr-bench
      - https://huggingface.co/datasets/nvidia/preference-asr-bench
    evaluated_domains:
      - domain: preference_aware_automatic_speech_recognition
        protocol: 3,210 English audio-instruction-reference triples plus 335 standard baseline items, derived from seven source corpora and covering normalization, entities, disfluencies, and case
        data_status: official_dataset_endpoint_unavailable
        note: The paper reports a two-stage LLM-assisted construction pipeline followed by human verification. Its official Hugging Face dataset endpoint currently returns HTTP 401 to unauthenticated requests, while the public companion repository contains evaluation and audio-reconstruction code but no benchmark JSONL or audio.
    license:
      paper: CC BY 4.0
      annotations: CC BY-SA 4.0 according to the companion repository license
      code: Apache-2.0
      upstream: LibriSpeech and AMI are CC BY 4.0; Common Voice and VoxPopuli are CC0; Earnings-22 is CC BY-SA 4.0; GigaSpeech requires its agreement; SPGISpeech is gated for academic research and internal use
    sources:
      - https://arxiv.org/html/2606.29534#S2
      - https://arxiv.org/html/2606.29534#S3
      - https://github.com/nithinraok/preference-asr-bench
      - https://raw.githubusercontent.com/nithinraok/preference-asr-bench/master/README.md
      - https://raw.githubusercontent.com/nithinraok/preference-asr-bench/master/LICENSE
      - https://api.github.com/repos/nithinraok/preference-asr-bench
      - https://api.github.com/repos/nithinraok/preference-asr-bench/git/trees/master?recursive=1
      - https://huggingface.co/datasets/nvidia/preference-asr-bench
    note: Preference-ASR is recorded as an audited protocol rather than a downloadable benchmark family. The paper and repository describe a public Hugging Face release, but that endpoint is currently inaccessible without credentials and exposes no verifiable public dataset card or files. The GitHub repository licenses author-created annotations and provides code to reconstruct audio from seven upstream corpora, but its current tree does not include the referenced data/preference_asr_testset.jsonl. Recheck the official dataset endpoint before adding an indexed family or helper.

  meetingtom:
