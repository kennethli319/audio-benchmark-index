      - https://arxiv.org/html/2607.04383v3#Sx5
      - https://arxiv.org/html/2607.04383v3#A11
      - https://huggingface.co/datasets/zihan-audio/AEGBench
      - https://huggingface.co/api/datasets/zihan-audio/AEGBench
    note: The abstract calls AEGBench released, but appendix K says the benchmark, audio, annotations, difficulty tags, and scripts will be released upon acceptance. The linked Hugging Face repository at revision b4e9fa95ad99d701b6e788c2aa51d7642ed61a75 has no dataset card, benchmark records, audio, annotations, or evaluation code. AEGBench is therefore recorded as an announced protocol rather than a downloadable benchmark family. The promised CC BY 4.0 and MIT terms do not license absent artifacts, and appendix K also preserves third-party audio terms while describing research-only use, so the eventual release terms require careful rechecking.

  tf_mossformer:
    paper: https://arxiv.org/abs/2607.21128
    sections: 3.1-3.3
    status: audited_existing_coverage
    last_verified: 2026-07-24
    evaluated_sets:
      - cited_as: WSJ0-2Mix
        index_id: wsj0_2mix
        status: restricted_source_corpus
        protocol: 8 kHz two-speaker mixtures with 20,000 training, 5,000 validation, and 3,000 speaker-disjoint test examples; SI-SDRi and SDRi are reported
    sources:
