metadata:
  repo_name: audio-benchmark-index
  title: Audio Benchmark Index
  seed_source:
    name: Qwen3.5-Omni Technical Report, section 5.1 Audio -> Text
    url: https://arxiv.org/html/2604.15804v1#S5
  last_checked: 2026-07-25
  scope: Audio -> Text benchmarks cited by Qwen3.5-Omni section 5.1, plus broader speech/audio/music benchmarks added from primary sources.
  note: This index does not mirror datasets or grant rights to upstream data.

paper_audits:
  echov2_asd_benchmark:
    paper: https://arxiv.org/abs/2607.10596
    title: "ECHOv2: Two-Level Band-Splitting Representation Learning for Anomalous Sound Detection"
    sections: abstract and official benchmark repository
    status: audited_new_public_benchmark_protocol
    evaluated_sets:
      - cited_as: DCASE 2020-2025 Task 2
        index_id: asd_benchmark
        status: public_protocol_over_official_source_releases
    protocol_note: >-
      The released ASD Benchmark applies one implementation to the official
      DCASE Task 2 splits from 2020 through 2025. It reports AUC and pAUC under
      two complementary protocols: nearest-neighbor scoring over frozen
      embeddings and lightweight adaptation over frozen representations.
    release_note: >-
      The MIT repository publishes evaluation code and converted evaluation
      file lists. Source audio remains in the six official DCASE releases and
      is not mirrored by this index. The repository also links a convenience
      Google Drive package, but does not state separate redistribution terms
      for that copy, so the helper does not fetch it.
    license_note: >-
      Benchmark code is MIT. Each underlying DCASE yearly release retains its
      own data and challenge terms; the benchmark repository does not
      re-license those recordings.
    sources:
      - https://arxiv.org/abs/2607.10596
      - https://github.com/yucongzh/ASD_Benchmark
      - https://raw.githubusercontent.com/yucongzh/ASD_Benchmark/master/README.md
      - https://raw.githubusercontent.com/yucongzh/ASD_Benchmark/master/LICENSE
      - https://api.github.com/repos/yucongzh/ASD_Benchmark

  stadium_crowd_noise_cross_venue_protocol:
    paper: https://arxiv.org/abs/2607.18922
    title: "Towards a reproducible cross-venue method for quantifying crowd noise in stadiums"
    sections: 3.1-5.2
    status: audited_proposed_protocol_no_released_test_cases
    public_interfaces: []
    evaluated_domains:
      - domain: cross_venue_stadium_crowd_noise_measurement
        protocol: >-
          The proposal targets 100-8,000 Hz crowd sound, requires Class 1-level
          instrumentation and a nominal far-field distance of at least 6.8 m
          for the 100 Hz lower bound, and reports fast-integrated A-weighted
          L_AF,max plus L_Aeq,T. A single-anchor SCL_max is a minimum baseline;
          the preferred mSCL_max takes the maximum across spatially distributed
          measurement units.
        data_status: protocol_public_no_test_cases_or_crowd_noise_database
        note: >-
          Section 5.2.2 explicitly says that no test cases are shared and calls
          collection of a sports-venue crowd-noise database future work.
          Therefore the formulas and reporting requirements are public, but
          there is no released cross-venue benchmark dataset, split, recording
          manifest, reference implementation, or scoring package to download.
    example_measurement:
      venue_event: PSV Eindhoven versus RKC Waalwijk, 19 May 2024
      use: >-
        Figure 2 illustrates the difference between a waveform peak and a
        fast-integrated maximum for ten seconds around a goal; it is an
        explanatory example, not a released test set.
      release_status: waveform_and_measurement_metadata_unreleased
    license:
      paper: not_exposed_in_arxiv_atom_metadata
      evaluation_artifacts: not_applicable_unreleased
    sources:
      - https://arxiv.org/abs/2607.18922
      - https://arxiv.org/html/2607.18922v1#S3
      - https://arxiv.org/html/2607.18922v1#S4
      - https://arxiv.org/html/2607.18922v1#S5.SS2.SSS2
      - https://export.arxiv.org/api/query?id_list=2607.18922
    note: >-
      This paper proposes a reproducible acoustic measurement and reporting
      protocol rather than releasing a benchmark family. The index records the
      protocol and its explicit release limitation without adding a dataset
      row, family count, download link, or helper.

  controllable_content_based_recommendations:
    paper: https://arxiv.org/abs/2607.20938
    title: "Controllable and Content-Based Recommendations"
    sections: 4.1-4.4 and appendix A.2
    status: audited_new_public_family_unreleased_derived_protocol
    evaluated_sets:
      - cited_as: Million Song Dataset (MSD)
        index_id: million_song_dataset
        status: public_metadata_and_interactions
        note: >-
          Section 4.1 reports a strong-generalization evaluation after
          preprocessing MSD to 31,046 items and 166,188 users, with 5,000
          validation and 5,000 test users. It uses 80 tag-based genre
          descriptors and reports Recall@20 and NDCG@100.
    protocol_note: >-
      CCBR generates offline item descriptions from music audio with
      MusicFlamingo, aggregates them into editable user profiles, and tests
      recommendation plus text- and audio-mediated concept interventions.
      The official MSD release provides derived acoustic features, metadata,
      tags, and Taste Profile play counts, but no listenable audio.
    release_note: >-
      The paper and project page do not publish the processed 31,046-item
      mapping, disjoint user split, cached MusicFlamingo descriptions, prompts,
      or audio used for the experiment. The indexed public MSD family therefore
      supports the source metadata and interaction benchmark, not exact
      reproduction of CCBR's derived evaluation protocol.
    license_note: >-
      Core Echo Nest-derived data uses the archived non-commercial API terms;
      MusicBrainz years are public domain and its tags/counts are
      CC BY-NC-SA 2.0. The paper does not separately license its unreleased
      derived artifacts or any audio it obtained outside MSD.
    sources:
      - https://arxiv.org/abs/2607.20938
      - https://arxiv.org/html/2607.20938v1#S4.SS1
      - https://firatoncel.github.io/ccbr/
      - http://millionsongdataset.com/
      - http://millionsongdataset.com/tasteprofile/
      - https://github.com/tbertinmahieux/MSongsDB
      - https://raw.githubusercontent.com/tbertinmahieux/MSongsDB/master/LICENSE

  openmic_instrument_grounding_diagnostics:
    paper: https://arxiv.org/abs/2606.31338
    title: "Beyond Binary Instrument QA: Probing Instrument Grounding in Music Audio-Language Models"
    sections: 2 and appendix A.1-A.7
    status: audited_announced_unreleased_protocols
    evaluated_sets:
      - cited_as: Binary Instrument-Presence QA
        index_id: null
        status: derived_metadata_unreleased
        examples: 9332
        source_family_id: openmic_2018
      - cited_as: Genre-Prior-Reduced Presence QA
        index_id: null
        status: derived_metadata_unreleased
        examples: 590
        source_family_id: openmic_2018
      - cited_as: Confusion-Aware Instrument Discrimination
        index_id: null
        status: derived_metadata_unreleased
        examples: 1051
        source_family_id: openmic_2018
      - cited_as: Long-Context Multi-label Instrument Recognition
        index_id: null
        status: derived_audio_and_metadata_unreleased
        examples: 1028
        source_family_id: openmic_2018
      - cited_as: Temporal Instrument Localization
        index_id: null
        status: derived_audio_and_metadata_unreleased
        examples: 3579
        source_family_id: openmic_2018
    protocol_note: >-
      Section 2 constructs five increasingly diagnostic evaluations from
      OpenMIC-2018 relevance labels. The first three use individual 10-second
      clips; the final two concatenate three source clips into 30-second
      inputs. The appendix documents prompt and CSV schemas, manually defined
      related-instrument groups, exact-set/F1 scoring for multi-label
      recognition, and three balanced temporal answer ranges. These details
      make the protocols auditable but do not constitute a public release.
    release_note: >-
      The v1 paper says the authors "will release" benchmark metadata, prompt
      templates, and evaluation code. It provides no official project page,
      repository, dataset card, archive, DOI, item manifest, or derived audio
      release. The public OpenMIC-2018 source family remains indexed, but its
      availability does not reproduce the paper's sampled rows, genre-hard
      split, manually defined candidates, concatenation assignments, prompts,
      or evaluation metadata. Recheck after an official release appears.
    license_note: >-
      OpenMIC-2018 is distributed through Zenodo under CC BY 4.0 and includes
      per-recording license metadata. No separate license is stated for the
      paper's unreleased annotations, prompts, or derived 30-second inputs.
    sources:
      - https://arxiv.org/abs/2606.31338
      - https://export.arxiv.org/e-print/2606.31338v1
      - https://zenodo.org/records/1432913
      - https://github.com/cosmir/openmic-2018
      - https://brianmcfee.net/papers/ismir2018_openmic.pdf

